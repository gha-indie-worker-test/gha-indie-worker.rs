name: remote reusable caller identity

on:
  pull_request:
    paths:
      - .github/workflows/remote-reusable-caller-identity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call:
    uses: gha-indie-worker/gha-indie-worker.rs/.github/workflows/conformance-reusable-called.yml@1507bb4daf2abaf59a569a176e67766a9cf30a9f
    with:
      phrase: remote-pontifex
      multiplier: 2
      expected_repository: ${{ github.repository }}
      expected_sha: ${{ github.sha }}

  verify:
    needs: call
    runs-on: ubuntu-latest
    steps:
      - name: Verify remote reusable outputs and caller checkout identity
        shell: bash
        env:
          RENDERED: ${{ needs.call.outputs.rendered }}
          SECRET_PRESENT: ${{ needs.call.outputs.secret_present }}
          CHECKOUT_REPOSITORY_MATCH: ${{ needs.call.outputs.checkout_repository_match }}
          CHECKOUT_SHA_MATCH: ${{ needs.call.outputs.checkout_sha_match }}
        run: |
          set -euo pipefail
          test "${RENDERED}" = 'remote-pontifex|remote-pontifex'
          test "${SECRET_PRESENT}" = false
          test "${CHECKOUT_REPOSITORY_MATCH}" = true
          test "${CHECKOUT_SHA_MATCH}" = true
