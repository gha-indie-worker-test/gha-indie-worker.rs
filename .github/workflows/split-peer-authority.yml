name: Split TypeSpec and JSON Schema peer-authority canary

on:
  pull_request:
    paths:
      - "contracts/typespec/**"
      - "contracts/json-schema/**"
      - "contracts/README.md"
      - ".github/workflows/split-peer-authority.yml"
  push:
    branches: [main]
    paths:
      - "contracts/typespec/**"
      - "contracts/json-schema/**"
      - "contracts/README.md"
      - ".github/workflows/split-peer-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TJSV_SHA: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out consumer revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact TJSV source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          path: .tjsv-tool
          persist-credentials: false

      - name: Verify validator revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .tjsv-tool rev-parse HEAD)" = "$TJSV_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install lockfile-pinned TJSV toolchain
        working-directory: .tjsv-tool
        run: npm ci --omit=dev

      - name: Expose the pinned TypeSpec toolchain to consumer package resolution
        shell: bash
        run: |
          set -euo pipefail
          test ! -e node_modules
          ln -s .tjsv-tool/node_modules node_modules

      - name: Native TypeSpec lane compiles
        shell: bash
        run: >-
          node .tjsv-tool/node_modules/@typespec/compiler/cmd/tsp.js compile
          contracts/typespec/main.tsp --no-emit

      - name: Generate TypeSpec Schema B and compare independent authorities
        shell: bash
        run: |
          set -euo pipefail
          node .tjsv-tool/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/typespec/worker-canary.tsp \
            --schema=contracts/json-schema/worker-canary.schema.json \
            --report=.typespec-json-schema-validator/report.json \
            --contract-ir=.typespec-json-schema-validator/contract-ir.json \
            --output-dir=.typespec-json-schema-validator/generated \
            --max-probes=64 \
            --quiet

      - name: Require exact-evidence consumer admission and refusal regressions
        shell: bash
        env:
          TSJSV_VERIFY_IR: .typespec-json-schema-validator/contract-ir.json
          TSJSV_VERIFY_REPORT: .typespec-json-schema-validator/report.json
          TSJSV_VERIFY_TYPESPEC: contracts/typespec/worker-canary.tsp
          TSJSV_VERIFY_AUTHORED: contracts/json-schema/worker-canary.schema.json
          TSJSV_VERIFY_GENERATED: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          TSJSV_VERIFY_DECLARATIONS: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'
          TSJSV_VERIFY_VERIFICATION: .typespec-json-schema-validator/regression-verification.json
        run: node .tjsv-tool/scripts/test-consumer-admission.mjs

      - name: Reject authored JSON Schema-only semantic drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .typespec-json-schema-validator/negative-json
          node <<'NODE'
          const fs = require('node:fs');
          const source = 'contracts/json-schema/worker-canary.schema.json';
          const target = '.typespec-json-schema-validator/negative-json/drift.schema.json';
          const schema = JSON.parse(fs.readFileSync(source, 'utf8'));
          schema.$defs.AuthorityKind.enum = ['typespec', 'json-schema', 'generated-authority'];
          fs.writeFileSync(target, `${JSON.stringify(schema, null, 2)}\n`);
          NODE
          set +e
          node .tjsv-tool/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/typespec/worker-canary.tsp \
            --schema=.typespec-json-schema-validator/negative-json/drift.schema.json \
            --report=.typespec-json-schema-validator/negative-json/report.json \
            --output-dir=.typespec-json-schema-validator/negative-json/generated \
            --max-probes=64 \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2

      - name: Reject TypeSpec-only semantic drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .typespec-json-schema-validator/negative-typespec
          cp contracts/typespec/worker-canary.tsp .typespec-json-schema-validator/negative-typespec/drift.tsp
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.typespec-json-schema-validator/negative-typespec/drift.tsp')
          text = path.read_text()
          text = text.replace(
              '  jsonSchema: "json-schema",\n',
              '  jsonSchema: "json-schema",\n  generatedAuthority: "generated-authority",\n',
          )
          path.write_text(text)
          PY
          set +e
          node .tjsv-tool/bin/typespec-json-schema-validator.mjs check \
            --typespec=.typespec-json-schema-validator/negative-typespec/drift.tsp \
            --schema=contracts/json-schema/worker-canary.schema.json \
            --report=.typespec-json-schema-validator/negative-typespec/report.json \
            --output-dir=.typespec-json-schema-validator/negative-typespec/generated \
            --max-probes=64 \
            --quiet
          status=$?
          set -e
          test "$status" -eq 2

      - name: Verify both authored authority lanes are immutable
        shell: bash
        run: git diff --exit-code -- contracts/typespec/ contracts/json-schema/

      - name: Retain diagnostic evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: split-peer-authority-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
